<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SCPRP Legacy</title>

    <link rel="stylesheet" href="./style.css?v=50">
</head>

<body>

    <!--
        Deux images superposées.
        Cela permet de faire un vrai fondu.
    -->

    <img
        id="background1"
        class="background active"
        src="./images/scp966.png"
        alt=""
    >

    <img
        id="background2"
        class="background"
        src="./images/scp106.png"
        alt=""
    >


    <!-- INFORMATIONS SERVEUR -->

    <div class="server-info">

        <div id="serverName">
            SCPRP Legacy
        </div>

        <div id="mapName">
            CONNEXION AU SERVEUR
        </div>

    </div>


    <!-- TITRE + DESCRIPTION -->

    <div id="scpInfo" class="scp-info">

        <h1 id="scpTitle">
            SCP-966
        </h1>

        <div class="separator"></div>

        <p id="scpDescription">
            Des créatures presque invisibles à l'œil humain.
            SCP-966 traque ses victimes en les privant progressivement
            de sommeil, jusqu'à les pousser à l'épuisement total.
        </p>

    </div>


    <!-- CHARGEMENT GMOD -->

    <div class="loading-container">

        <div class="loading-header">

            <span id="status">
                INITIALISATION...
            </span>

            <span id="percentage">
                0%
            </span>

        </div>


        <div class="progress-background">

            <div id="progressBar"></div>

        </div>


        <div id="fileName">
            Préparation de la connexion...
        </div>

    </div>
    <!-- MUSIQUE -->

<!-- On ajoute "muted" pour que le navigateur autorise l'autoplay sans bloquer -->
<audio id="backgroundMusic" autoplay loop muted preload="auto">
    <source src="./audio/hitman.mp3" type="audio/mpeg">
</audio>

<script>
    const audio = document.getElementById('backgroundMusic');

    // Dès que l'utilisateur clique n'importe où, le son s'active
    document.body.addEventListener('click', function() {
        audio.muted = false;
        // Si l'autoplay a quand même échoué, on force la lecture
        if (audio.paused) {
            audio.play();
        }
    }, { once: true });
</script>

<!-- CRÉDIT -->

<div class="music-credit">
    ♪ "Hitman" — Kevin MacLeod<br>
</div>


    <script src="./script.js?v=50"></script>

</body>

</html>
