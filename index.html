<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Legacy SCPRP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Deux fonds pour faire le fondu -->
    <div id="background1" class="background active"></div>
    <div id="background2" class="background"></div>

    <!-- Effets -->
    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>

    <!-- Informations serveur -->
    <div class="server-info">

        <div id="serverName">
            SCP ROLEPLAY
        </div>

        <div id="mapName">
            CONNEXION AU SERVEUR
        </div>

    </div>

    <!-- Informations SCP -->
    <div id="scpInfo" class="scp-info">

        <h1 id="scpTitle">
            SCP-035
        </h1>

        <div class="separator"></div>

        <p id="scpDescription">
            SCP-035 est un masque ancien et conscient,
            capable d'influencer mentalement et de posséder
            quiconque le porte.
        </p>

    </div>

    <!-- Barre de chargement -->
    <div class="loading-container">

        <div class="loading-header">

            <span id="status">
                INITIALISATION...
            </span>

            <span id="percentage">
                0%
            </span>

        </div>

        <div class="progress-background">
            <div id="progressBar"></div>
        </div>

        <div id="fileName">
            Préparation de la connexion...
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
