<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SCPRP Legacy</title>

    <link rel="stylesheet" href="./style.css?v=50">
</head>

<body>

    <!--
        Deux images superposées.
        Cela permet de faire un vrai fondu.
    -->

    <img
        id="background1"
        class="background active"
        src="./images/scp966.png"
        alt=""
    >

    <img
        id="background2"
        class="background"
        src="./images/scp106.png"
        alt=""
    >


    <!-- INFORMATIONS SERVEUR -->

    <div class="server-info">

        <div id="serverName">
            SCPRP Legacy
        </div>

        <div id="mapName">
            CONNEXION AU SERVEUR
        </div>

    </div>


    <!-- TITRE + DESCRIPTION -->

    <div id="scpInfo" class="scp-info">

        <h1 id="scpTitle">
            SCP-966
        </h1>

        <div class="separator"></div>

        <p id="scpDescription">
            Des créatures presque invisibles à l'œil humain.
            SCP-966 traque ses victimes en les privant progressivement
            de sommeil, jusqu'à les pousser à l'épuisement total.
        </p>

    </div>


    <!-- CHARGEMENT GMOD -->

    <div class="loading-container">

        <div class="loading-header">

            <span id="status">
                INITIALISATION...
            </span>

            <span id="percentage">
                0%
            </span>

        </div>


        <div class="progress-background">

            <div id="progressBar"></div>

        </div>


        <div id="fileName">
            Préparation de la connexion...
        </div>

    </div>
    <!-- MUSIQUE -->

<!-- L'iframe en 1x1 pixel, avec le lien "embed" formaté pour l'autoplay en boucle -->
<iframe width="1" height="1" 
        src="https://www.youtube.com/embed/hTIIK5Sa6mc?autoplay=1&loop=1&playlist=hTIIK5Sa6mc&controls=0" 
        frameborder="0" 
        allow="autoplay">
</iframe>
<!-- CRÉDIT -->

<div class="music-credit">
    ♪ "Hitman" — Kevin MacLeod<br>
</div>


    <script src="./script.js?v=50"></script>

</body>

</html>
